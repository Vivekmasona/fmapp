name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Dependencies
      run: npm install

    - name: Auto Create www Folder & Move index.html
      run: |
        mkdir -p www
        if [ -f index.html ]; then
          mv index.html www/
        fi

    - name: Add Capacitor Android Platform
      run: |
        npx @capacitor/cli add android

    - name: Force Apply Custom Icon from img/fm.png
      run: |
        RES_DIR="android/app/src/main/res"
        
        # Purane saare default icons delete karna
        rm -rf $RES_DIR/mipmap-*/*
        
        # Mipmap folders ensure karna
        mkdir -p $RES_DIR/mipmap-mdpi
        mkdir -p $RES_DIR/mipmap-hdpi
        mkdir -p $RES_DIR/mipmap-xhdpi
        mkdir -p $RES_DIR/mipmap-xxhdpi
        mkdir -p $RES_DIR/mipmap-xxxhdpi
        
        if [ -f img/fm.png ]; then
          cp img/fm.png $RES_DIR/mipmap-mdpi/ic_launcher.png
          cp img/fm.png $RES_DIR/mipmap-hdpi/ic_launcher.png
          cp img/fm.png $RES_DIR/mipmap-xhdpi/ic_launcher.png
          cp img/fm.png $RES_DIR/mipmap-xxhdpi/ic_launcher.png
          cp img/fm.png $RES_DIR/mipmap-xxxhdpi/ic_launcher.png
          
          cp img/fm.png $RES_DIR/mipmap-mdpi/ic_launcher_round.png
          cp img/fm.png $RES_DIR/mipmap-hdpi/ic_launcher_round.png
          cp img/fm.png $RES_DIR/mipmap-xhdpi/ic_launcher_round.png
          cp img/fm.png $RES_DIR/mipmap-xxhdpi/ic_launcher_round.png
          cp img/fm.png $RES_DIR/mipmap-xxxhdpi/ic_launcher_round.png
          echo "Custom icon applied successfully!"
        else
          echo "Error: img/fm.png not found!"
          exit 1
        fi

    - name: Sync Capacitor Android
      run: |
        npx @capacitor/cli sync android

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VFY-FM-Studio-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
