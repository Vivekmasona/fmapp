name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Dependencies
      run: npm install

    - name: Auto Create www Folder & Move index.html
      run: |
        mkdir -p www
        if [ -f index.html ]; then
          mv index.html www/
        fi

    - name: Add Capacitor Android Platform
      run: |
        npx @capacitor/cli add android

    - name: Force Apply Same Image (img/fm.png) for Icon and Splash
      run: |
        RES_DIR="android/app/src/main/res"
        
        # 1. Purane icons aur splash delete karna
        rm -rf $RES_DIR/mipmap-*/*
        rm -rf $RES_DIR/drawable*/*
        
        # 2. Mipmap (Icon) folders ensure karna aur copy karna
        mkdir -p $RES_DIR/mipmap-mdpi
        mkdir -p $RES_DIR/mipmap-hdpi
        mkdir -p $RES_DIR/mipmap-xhdpi
        mkdir -p $RES_DIR/mipmap-xxhdpi
        mkdir -p $RES_DIR/mipmap-xxxhdpi
        
        # 3. Drawable (Splash screen background/image) folders ensure karna
        mkdir -p $RES_DIR/drawable
        mkdir -p $RES_DIR/drawable-land-mdpi
        mkdir -p $RES_DIR/drawable-land-hdpi
        mkdir -p $RES_DIR/drawable-land-xhdpi
        mkdir -p $RES_DIR/drawable-land-xxhdpi
        mkdir -p $RES_DIR/drawable-land-xxxhdpi
        mkdir -p $RES_DIR/drawable-port-mdpi
        mkdir -p $RES_DIR/drawable-port-hdpi
        mkdir -p $RES_DIR/drawable-port-xhdpi
        mkdir -p $RES_DIR/drawable-port-xxhdpi
        mkdir -p $RES_DIR/drawable-port-xxxhdpi

        if [ -f img/fm.png ]; then
          # Icons copy karna
          cp img/fm.png $RES_DIR/mipmap-mdpi/ic_launcher.png
          cp img/fm.png $RES_DIR/mipmap-hdpi/ic_launcher.png
          cp img/fm.png $RES_DIR/mipmap-xhdpi/ic_launcher.png
          cp img/fm.png $RES_DIR/mipmap-xxhdpi/ic_launcher.png
          cp img/fm.png $RES_DIR/mipmap-xxxhdpi/ic_launcher.png
          
          cp img/fm.png $RES_DIR/mipmap-mdpi/ic_launcher_round.png
          cp img/fm.png $RES_DIR/mipmap-hdpi/ic_launcher_round.png
          cp img/fm.png $RES_DIR/mipmap-xhdpi/ic_launcher_round.png
          cp img/fm.png $RES_DIR/mipmap-xxhdpi/ic_launcher_round.png
          cp img/fm.png $RES_DIR/mipmap-xxxhdpi/ic_launcher_round.png

          # Splash screen image copy karna (drawable folders mein)
          cp img/fm.png $RES_DIR/drawable/splash.png
          cp img/fm.png $RES_DIR/drawable-port-mdpi/splash.png
          cp img/fm.png $RES_DIR/drawable-port-hdpi/splash.png
          cp img/fm.png $RES_DIR/drawable-port-xhdpi/splash.png
          cp img/fm.png $RES_DIR/drawable-port-xxhdpi/splash.png
          cp img/fm.png $RES_DIR/drawable-port-xxxhdpi/splash.png
          
          echo "Icon and Splash successfully applied using img/fm.png!"
        else
          echo "Error: img/fm.png not found!"
          exit 1
        fi

    - name: Sync Capacitor Android
      run: |
        npx @capacitor/cli sync android

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VFY-FM-Studio-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
