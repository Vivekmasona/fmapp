name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Dependencies
      run: npm install

    - name: Set App Name in Capacitor Config
      run: |
        npx @capacitor/cli config set appName "VFyFm"

    - name: Auto Create www Folder & Move index.html
      run: |
        mkdir -p www
        if [ -f index.html ]; then
          mv index.html www/
        fi

    - name: Add Capacitor Android Platform
      run: |
        npx @capacitor/cli add android

    - name: Generate App Icon from img/fm.png
      run: |
        npm install @capacitor/assets --save-dev
        npx @capacitor/assets generate --icon img/fm.png --android

    - name: Sync Capacitor Android
      run: |
        npx @capacitor/cli sync android

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VFyFm-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
